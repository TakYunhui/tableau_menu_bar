<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tableau Navigator POC</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="brand-card">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-copy">
        <p class="eyebrow">Tableau Navigator</p>
        <h1>Cross-Post Entry Menu</h1>
        <p class="summary">
          좌측 메뉴는 서로 다른 게시글 주소의 진입 대시보드만 이동한다.
          같은 게시글 내부 화면 전환은 Tableau 상단 탭을 유지한다.
        </p>
      </div>
      <div id="status" class="status is-pending">Tableau 환경 확인 중</div>
    </header>

    <section class="sidebar-card" aria-label="대시보드 카테고리">
      <div class="section-head">
        <p class="section-kicker">Navigator</p>
        <h2>카테고리</h2>
      </div>
      <div id="menu-root" class="menu-root"></div>
    </section>

    <section class="guide-card" aria-label="운영 원칙">
      <h2>운영 원칙</h2>
      <ul>
        <li>카테고리 클릭 시 해당 게시글의 첫 탭 주소로 이동한다.</li>
        <li>같은 게시글 안의 나머지 화면은 상단 탭에서 이동한다.</li>
        <li>URL이 없는 카테고리는 접어서 구조만 먼저 보여준다.</li>
      </ul>
    </section>
  </main>

  <script src="https://extensions.tableauusercontent.com/resources/tableau.extensions.1.latest.min.js"></script>
  <script src="./menu-config.js"></script>
  <script src="./main.js"></script>
</body>
</html>
